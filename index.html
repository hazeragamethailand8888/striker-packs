o.innerHTML=`<div class=lvs><div class=lvt><span class=lva>${esc(M.a.av)}</span><b>${esc(M.a.name)}</b></div><div class=lsc><span id=sa>0</span> : <span id=sb>0</span><small id=mn>เริ่มใน 3…</small></div><div class=lvt><b>${esc(M.b.name)}</b><span class=lva>${esc(M.b.av)}</span></div></div><div id=lvf class=lvf></div><div id=lvr></div>`;document.body.appendChild(o);
const tx=e=>{const mine=e.s==me;switch(e.t){case'goal':return[mine?'⚽ GOAL! '+e.who:'💥 เสียประตู',mine?'#22c55e':'#ef4444'];case'red':return[mine?'🟥 ใบแดง! เราเหลือ 10 คน':'🟥 คู่แข่งโดนไล่ออก','#ef4444'];case'rain':return['🌧 ฝนตกหนัก'];case'pen':return[mine?'🎯 ได้จุดโทษ… เข้า!':'🎯 เสียจุดโทษ',mine?'#22c55e':'#ef4444'];case'penmiss':return[mine?'🎯 จุดโทษพลาด':'🎯 คู่แข่งยิงจุดโทษพลาด'];case'miss':return[mine?'ยิงเฉียดเสา':'เซฟได้ทัน!'];default:return['เกมสูสี']}};
const d0=M.delay||3000;snd(500,.3,'square');
R.ev.forEach((e,i)=>setTimeout(()=>{$('#sa').textContent=e.g[0];$('#sb').textContent=e.g[1];$('#mn').textContent=e.mn+"'";const[t,c]=tx(e),d=document.createElement('div');d.textContent=e.mn+"' "+t;d.className='lvl';$('#lvf').prepend(d);if(e.t=='goal'){banner(t,c);snd(e.s==me?880:220,.3,'triangle')}},d0+i*900));
setTimeout(()=>{const g=R.g,res=g[me]>g[1-me]?'w':g[me]==g[1-me]?'d':'l';formUpd(res=='w'?1:res=='d'?0:-1);if(res=='w'){S.c+=150;confetti()}save();hud();$('#lvr').innerHTML='<b style="color:#fbbf24;font-size:20px">'+(res=='w'?'🏆 ชนะ ':res=='d'?'🤝 เสมอ ':'💀 แพ้ ')+g[me]+'-'+g[1-me]+'</b><br><button class=btn id=lvx style="margin-top:10px">ปิด</button>';$('#lvx').onclick=()=>o.remove();api('/api/rt/result',{mid:M.mid,res})},d0+R.ev.length*900+1000)}
function rtConnect(){if(!SRV||!TOK||ES)return;ES=new EventSource('/api/rt/stream?token='+TOK);
ES.addEventListener('chat',e=>{CH.push(JSON.parse(e.data));CH=CH.slice(-50);chatDraw()});
ES.addEventListener('invite',e=>showInvite(JSON.parse(e.data)));ES.addEventListener('match',e=>liveMatch(JSON.parse(e.data)));
ES.addEventListener('decline',()=>toast('คู่แข่งปฏิเสธคำท้า'));ES.addEventListener('points',e=>{const p=JSON.parse(e.data);toast(p.err||(p.gain?'🏅 ได้แต้มออนไลน์ +'+p.gain:'จบแมตช์ (แต้มไม่เพิ่ม ท้าคู่เดิมถี่เกินไป)'))})}
function online(m){if(!SRV){m.innerHTML='<h2>ออนไลน์ 🌍</h2><div class=pn><small>โหมดออนไลน์ใช้ได้เมื่อเปิดเกมจากเซิร์ฟเวอร์ของคุณเอง (ดู README) หน้านี้เป็นโหมดเล่นในเครื่อง</small></div>';return}
rtConnect();m.innerHTML=`<h2>ออนไลน์ 🌍 <small id=lad></small></h2><div class=g2><div class=pn><b>💬 แชตรวม</b><div id=chl class=chl></div><div class=row style="margin-top:6px;flex-wrap:nowrap"><input id=cmsg maxlength=120 placeholder="พิมพ์ข้อความ…"><button class=btn id=csn>ส่ง</button></div></div><div class=pn><b>🟢 ผู้เล่นออนไลน์</b><div id=onl>…</div></div></div><div class=row style="margin-top:10px"><input id=sq placeholder="ค้นหาชื่อผู้เล่น" style="max-width:200px"><button class=btn id=sg>ค้นหา</button></div><div id=pf></div><b>เพื่อน</b><div id=fl>…</div><div id=mlog style="margin-top:10px"></div>`;
srvPush();api('/api/rt/chat').then(r=>{CH=r.rows||[];chatDraw()});
const lo=()=>api('/api/rt/online').then(r=>{if(!$('#onl'))return;$('#onl').innerHTML=(r.rows||[]).filter(x=>x.name!=cur).map(u=>frow(u,1,1)).join('')||'<small>ยังไม่มีคนอื่นออนไลน์</small>';bindRows()});lo();const iv=setInterval(()=>{if(tab!=22||!$('#onl'))return clearInterval(iv);lo()},8000);
api('/api/friends').then(r=>{if(!$('#lad'))return;$('#lad').textContent='แต้มออนไลน์ '+(r.points||0);$('#fl').innerHTML=(r.rows||[]).map(f=>frow(f,0,1)).join('')||'<small>ยังไม่มีเพื่อน</small>';bindRows()});
$('#csn').onclick=sendChat;$('#cmsg').onkeydown=e=>{if(e.key=='Enter')sendChat()};
$('#sg').onclick=async()=>{const r=await api('/api/user/'+encodeURIComponent($('#sq').value.trim()));$('#pf').innerHTML=r.ok?frow(r.user,1,1):'<small>'+esc(r.err||'ไม่พบ')+'</small>';bindRows()}}
async function challenge(name){const r=await api('/api/lineup/'+encodeURIComponent(name));if(!r.ok)return toast(r.err||'ท้าไม่ได้');if(r.wait>0)return toast('ท้าคนนี้ได้อีกใน '+Math.ceil(r.wait/60)+' นาที');
const L=r.lineup,ps=L.ids.map(id=>POOL[id]).filter(Boolean);if(ps.length<11)return toast('ทีมของเขายังไม่พร้อม');
const op=ps.reduce((a,p)=>{const u=(L.up||{})[p.id]||0;return a+p.o+u+(u>=5?2:0)+((L.fo||{})[p.id]||0)},0)/11,off=()=>document.querySelectorAll('[data-ch]').forEach(b=>b.disabled=false);
document.querySelectorAll('[data-ch]').forEach(b=>b.disabled=true);
if(!sim(op,async(w,g)=>{const res=g[0]>g[1]?'w':g[0]==g[1]?'d':'l',rr=await api('/api/challenge',{target:name,res});formUpd(res=='w'?1:res=='d'?0:-1);if(res=='w'&&rr.ok)S.c+=150;save();hud();$('#mlog').insertAdjacentHTML('beforeend','<div><b style="color:#fbbf24">'+(res=='w'?'🏆 ชนะ ':res=='d'?'🤝 เสมอ ':'💀 แพ้ ')+g[0]+'-'+g[1]+' · '+(rr.ok?'แต้ม +'+rr.gain+(res=='w'?' · 🪙+150':''):(rr.err||''))+'</b></div>');off()},1))off()}
$('#rtb').onclick=async()=>{try{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape')}catch(e){}};
fetch('/api/ping').then(r=>r.json()).then(j=>{SRV=!!j.ok}).catch(()=>{}).finally(()=>auth());
</script></body></html>
