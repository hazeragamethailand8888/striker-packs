async function T(kind,arg){const r=await rpc('g_tx',{p_tok:TOK,p_kind:kind,p_arg:arg||{}});if(!r||!r.ok){toast((r&&r.err)||'ไม่สำเร็จ');return{ok:0}}return r}

async function openPackS(k){const r=await T('pack',{k});if(!r.ok)return;_PRE=r.res;openPack0(k)}
function openPack(k,free){if(V3)return openPackS(k);return openPack0(k,free)}

function zoomQR(){const d=document.createElement('div');d.className='lv';d.style.cursor='zoom-out';d.innerHTML='<h2>สแกนด้วยแอปธนาคารหรือทรูมันนี่</h2><img src="'+SUPQR+'" style="width:min(80vh,92vw);background:#fff;border-radius:12px;image-rendering:pixelated"><small>แตะที่ใดก็ได้เพื่อปิด · ตรวจชื่อผู้รับก่อนกดยืนยันโอนทุกครั้ง</small>';d.onclick=()=>d.remove();document.body.appendChild(d)}
function support(m){m.innerHTML='<h2>สนับสนุนผู้พัฒนา 💖</h2><div style="display:flex;flex-wrap:wrap;gap:14px"><div class=pn style="text-align:center;flex:1 1 360px"><img id=qri src="'+SUPQR+'" alt="PromptPay QR" style="width:330px;max-width:100%;zoom:calc(1 / var(--z,1.2));background:#fff;border-radius:12px;cursor:zoom-in;image-rendering:pixelated"><br><small>แตะรูปเพื่อขยายให้สแกนง่ายขึ้น</small></div><div class=pn style="line-height:1.7;flex:1 1 300px"><b style="font-size:18px">ขอบคุณที่ช่วยกันทำเกมนี้ต่อไป</b><div style="margin-top:8px;font-size:14px">เงินสนับสนุนใช้เป็นค่าเซิร์ฟเวอร์และพัฒนาระบบใหม่ ๆ<br>เป็นความสมัครใจทั้งหมด <b>ไม่ได้แลกเป็นเหรียญ การ์ด หรือไอเทมในเกมโดยอัตโนมัติ</b><br>สแกนได้จากแอปธนาคารหรือทรูมันนี่ (PromptPay) ตรวจชื่อผู้รับให้ตรงกับในรูปก่อนยืนยันโอนทุกครั้ง<br>ผู้เล่นอายุต่ำกว่า 18 ปี ควรขออนุญาตผู้ปกครองก่อน</div></div></div>';$('#qri').onclick=zoomQR}
function board(m){m.innerHTML='<h2>อันดับออนไลน์ 🥇</h2><div class=row>'+[['power','⚡ POWER'],['rp','🏅 แรงค์ (RP)'],['points','⚔️ แต้มท้าทีม']].map(([k,n])=>'<button class="btn '+(bd==k?'':'g')+'" data-bd="'+k+'">'+n+'</button>').join('')+'<span class=chip id=mypos></span></div><div id=bdl><small>กำลังโหลด…</small></div>'+(V4?'<h2 style="margin-top:12px">ผู้ชนะประจำสัปดาห์ 🏆</h2><div id=wkw><small>กำลังโหลด…</small></div>':'');
const val=x=>bd=='rp'?(+x.rp||0)+' RP':bd=='points'?(+x.points||0)+' แต้ม':'⚡ '+(+x.power||0);
api('/api/board?by='+bd).then(r=>{const e=$('#bdl');if(!e)return;e.innerHTML='<table class=lb>'+(r.rows||[]).map((x,i)=>'<tr style="'+(x.name==cur?'background:#ff2d5530;font-weight:bold':'')+'"><td>'+(['🥇','🥈','🥉'][i]||'#'+(i+1))+'</td><td>'+esc(x.av||'😎')+' '+esc(x.name)+'</td><td>LV '+(+x.lv)+'</td><td style="color:#fbbf24">'+val(x)+'</td></tr>').join('')+'</table>'});
if(V4){api('/api/rank_me',{by:bd}).then(r=>{const e=$('#mypos');if(e&&r.ok)e.textContent='คุณอยู่อันดับ '+r.pos+' จาก '+r.of});
api('/api/weekly').then(r=>{const e=$('#wkw');if(!e||!r.ok)return;const mine=r.mine||[],sum=mine.reduce((a,x)=>a+x.reward,0);e.innerHTML=((r.winners||[]).map(x=>'<div class=ms><span>'+esc(x.week)+'</span><span>'+(x.kind=='power'?'⚡ POWER':'🏅 แรงค์')+'</span><b>'+esc(x.av||'😎')+' '+esc(x.name)+'</b><span style="color:#fbbf24">'+(+x.score)+'</span></div>').join('')||'<small>ยังไม่มีผู้ชนะ (สรุปทุกต้นสัปดาห์)</small>')+(sum?'<div class=row style="margin-top:8px"><button class=btn id=wkc>🎁 คุณชนะ! รับรางวัล '+sum.toLocaleString()+' 🪙</button></div>':'');const b=$('#wkc');if(b)b.onclick=async()=>{const j=await api('/api/weekly/claim');if(j.ok){toast('รับ '+j.coins.toLocaleString()+' เหรียญ');view()}else toast(j.err||'ไม่สำเร็จ')}})}
m.querySelectorAll('[data-bd]').forEach(b=>b.onclick=()=>{bd=b.dataset.bd;view()})}
function fstats(m){m.insertAdjacentHTML('beforeend','<h2 style="margin-top:12px">สถิติสัปดาห์นี้ของเพื่อน 📊</h2><div id=fst><small>กำลังโหลด…</small></div>');api('/api/fstats').then(r=>{const e=$('#fst');if(!e||!r.ok)return;e.innerHTML='<table class=lb><tr style="color:#9aa3b5"><td>ผู้เล่น</td><td>แมตช์</td><td>ชนะ</td><td>ซอง</td><td>POWER</td><td>RP</td></tr>'+(r.rows||[]).map(x=>'<tr style="'+(x.me?'background:#ff2d5530;font-weight:bold':'')+'"><td>'+esc(x.av||'😎')+' '+esc(x.name)+'</td><td>'+(+x.played)+'</td><td>'+(+x.wins)+'</td><td>'+(+x.packs)+'</td><td>'+(+x.power)+'</td><td>'+(+x.rp)+'</td></tr>').join('')+'</table>'})}
function online(m){online1(m);if(V4)fstats(m)}

let CFG='';
function uiZ(){const u=ls('sp2_ui');if(u&&u!='auto'&&+u>0)return +u;return Math.max(1.3,Math.min(2.4,Math.min(innerWidth/620,innerHeight/290)))}
function fitUI(){const e=innerWidth/uiZ();document.body.classList.toggle('n1',e<900);document.body.classList.toggle('n2',e<720)}
addEventListener('resize',()=>{document.documentElement.style.setProperty('--z',String(uiZ()));fitUI()});
async function diag(){const L=[];L.push((CFG=='ok'?'✅':'❌')+' ไฟล์ config.json: '+(CFG=='ok'?'พบและอ่านได้':(CFG||'ยังไม่ได้ตรวจ')));
if(SUP){L.push('🌐 โปรเจกต์ Supabase: '+new URL(SUP.url).host);const r=await rpc('g_board',{p_by:'power'});L.push(r&&r.ok?'✅ ฐานข้อมูลหลัก (supabase.sql): ใช้งานได้':'❌ ฐานข้อมูลหลัก: '+((r&&r.err)||'ไม่ตอบสนอง')+' → ตรวจ URL/คีย์ หรือยังไม่ได้รัน supabase.sql');L.push(V2?'✅ ส่วนเสริม v2: พร้อม':'⚠️ ยังไม่พบ v2 (supabase_v2.sql)');
L.push(TOK?(V3?'✅ v3 (เศรษฐกิจฝั่งเซิร์ฟเวอร์): พร้อม':'⚠️ ยังไม่พบ v3 (supabase_v3.sql)'):'ℹ️ v3/v4 ตรวจได้หลังเข้าสู่ระบบ');if(TOK)L.push(V4?'✅ v4 (ผู้ชนะรายสัปดาห์): พร้อม':'⚠️ ยังไม่พบ v4 (supabase_v4.sql)')}
else L.push('💾 โหมด: ในเครื่อง (ยังไม่เชื่อมออนไลน์) — อันดับ เซฟ เพื่อน จะไม่ข้ามเครื่อง');
if(location.protocol=='file:')L.push('ℹ️ เปิดจากไฟล์ในเครื่อง (file://) ต้องเปิดผ่านเว็บ ระบบออนไลน์ถึงจะทำงาน');
return L}
async function showDiag(){const d=document.createElement('div');d.className='lv';d.innerHTML='<h2>🔧 สถานะการเชื่อมต่อ</h2><div class=pn id=dgb style="width:min(640px,92vw);text-align:left;line-height:1.9"><small>กำลังตรวจ…</small></div><div class=row><button class=btn id=dgx>ปิด</button></div>';document.body.appendChild(d);$('#dgx').onclick=()=>d.remove();const L=await diag(),b=$('#dgb');if(!b)return;b.innerHTML='';L.forEach(x=>{const e=document.createElement('div');e.textContent=x;b.appendChild(e)})}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-diag]');if(t){e.preventDefault();showDiag()}});
(function(){const fx=document.createElement('div');fx.id='fx';const E=['⚽','✨','⭐','🪙','💎','🔥'];for(let i=0;i<20;i++){const e=document.createElement('i');e.textContent=E[i%6];e.style.cssText='left:'+(Math.random()*96)+'%;font-size:'+(14+Math.random()*24)+'px;animation-duration:'+(14+Math.random()*20)+'s;animation-delay:-'+(Math.random()*30)+'s';fx.appendChild(e)}$('#app').prepend(fx);if(ls('sp2_fx')==='off')document.body.classList.add('nofx')})();
document.addEventListener('pointermove',e=>{if(e.pointerType!='mouse')return;const t=e.target.closest&&e.target.closest('.tile,.ft,.pk');document.querySelectorAll('.tilt').forEach(x=>{if(x!==t){x.classList.remove('tilt');x.style.transform=''}});if(!t)return;const r=t.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;t.classList.add('tilt');t.style.transform='perspective(700px) rotateX('+(-py*10)+'deg) rotateY('+(px*12)+'deg) translateY(-4px)'});
document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('.btn,.tile,.ft,.pk,.ct');if(!t)return;const r=t.getBoundingClientRect(),s=document.createElement('span');s.className='rip';s.style.cssText='left:'+((e.clientX-r.left)/r.width*100)+'%;top:'+((e.clientY-r.top)/r.height*100)+'%';t.appendChild(s);setTimeout(()=>s.remove(),650)});
$('#rtb').onclick=async()=>{try{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape')}catch(e){}};
fetch('config.json').then(r=>{if(!r.ok){CFG='ไม่พบไฟล์ config.json (HTTP '+r.status+')';return null}return r.text().then(t=>{try{return JSON.parse(t)}catch(e){CFG='config.json เขียนไม่ถูกรูปแบบ JSON (ตรวจเครื่องหมายคำพูดและจุลภาค)';return null}})}).then(c=>{if(c&&!(c.url&&c.key))CFG='config.json ต้องมีทั้ง "url" และ "key"';if(c&&c.url&&c.key){CFG='ok';SUP={url:String(c.url).replace(/\/$/,''),key:c.key};SRV=true}}).catch(()=>{if(!CFG)CFG='โหลด config.json ไม่ได้'}).then(()=>SUP?rpc('g_news',{}).then(r=>{if(r&&r.ok){V2=true;NEWS=r.rows||[]}}):fetch('/api/ping').then(r=>r.json()).then(j=>{SRV=!!j.ok}).catch(()=>{})).finally(()=>auth());
